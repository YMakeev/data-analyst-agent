# Конфіг Railway.
#
# Порядок дій у їхньому інтерфейсі:
#   1. New Project → Deploy from GitHub repo → обери цей репозиторій
#   2. New → Database → PostgreSQL (у тому самому проєкті)
#   3. У сервісі → Variables:
#        DATABASE_URL       = ${{Postgres.DATABASE_URL}}
#        ADMIN_DATABASE_URL = ${{Postgres.DATABASE_URL}}
#        MCP_TRANSPORT      = http
#        SEED_ON_START      = 1     ← прибрати після першого успішного старту
#   4. Settings → Networking → Generate Domain
#
# База живе в тому самому проєкті й спілкується з сервером по приватній
# мережі — назовні вона не світить портом узагалі. Це та сама ідея, що й
# read-only роль, тільки на рівні інфраструктури.
#
# Посилання, яке потім віддається команді:
#   https://<твій-домен>.up.railway.app/mcp

[build]
builder = "dockerfile"
dockerfilePath = "deploy/Dockerfile"

[deploy]
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
